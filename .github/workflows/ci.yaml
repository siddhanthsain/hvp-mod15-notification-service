# .github/workflows/ci.yaml
# MOD-15 - Notification service - CI Pipeline
# Runs on every push. Test + lint + coverage and Docker build must pass.

name: CI - MOD-15

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  # -- Job 1: Test + Lint + Coverage -----------------------------------------
  test:
    name: Test + Lint + Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format
        run: ruff format --check src/ tests/

      - name: mypy type check
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          set +e
          if ! find tests/unit -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo 'No unit tests yet (scaffold) - CI passes'
            exit 0
          fi
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 5 ]; then
            echo 'No tests collected (scaffold) - CI passes'
            exit 0
          fi
          exit $EXIT_CODE
        env:
          HVP_BASE_HOST: http://localhost

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-MOD-15
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # -- Job 2: Docker build ----------------------------------------------------
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: |
          docker build -t hvp/hvp-mod15-notification-service:${{ github.sha }} \
            -f docker/Dockerfile .

      - name: Verify container starts and /health responds
        run: |
          docker run --rm -d --name test_container \
            -p 8015:8015 \
            -e HVP_BASE_HOST=http://host.docker.internal \
            hvp/hvp-mod15-notification-service:${{ github.sha }}
          sleep 8
          curl -f http://localhost:8015/health || \
            { docker logs test_container; docker stop test_container; exit 1; }
          docker stop test_container

      - name: Check image size (warn if >500MB)
        run: |
          SIZE=$(docker image inspect hvp/hvp-mod15-notification-service:${{ github.sha }} \
            --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "Image size: ${SIZE}MB"
          [ "$SIZE" -lt 500 ] || echo "WARNING: image is ${SIZE}MB - consider multi-stage build"
