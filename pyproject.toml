[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvp_mod15_notification_service"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<0.29",
    "pydantic>=2.0,<3.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<0.24",
    "ruff>=0.4,<1.0",
    "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
